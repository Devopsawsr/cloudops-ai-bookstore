name: Deploy AWS Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag; defaults to the selected commit SHA
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudops-ai-bookstore-aws-dev
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: aws-dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --pull --tag "${image}" .
          docker push "${image}"

      - name: Copy deployment definitions to S3-free SSM payload
        run: |
          set -euo pipefail
          compose_b64=$(base64 -w0 deploy/docker-compose.aws.yml)
          nginx_b64=$(base64 -w0 deploy/nginx.conf)
          deploy_b64=$(base64 -w0 deploy/deploy.sh)
          jq -n \
            --arg compose "$compose_b64" \
            --arg nginx "$nginx_b64" \
            --arg deploy "$deploy_b64" \
            --arg region "$AWS_REGION" \
            --arg registry "${{ steps.ecr.outputs.registry }}" \
            --arg repository "$ECR_REPOSITORY" \
            --arg tag "$IMAGE_TAG" \
            '{commands:[
              "sudo install -d -m 0755 /opt/cloudops-ai-bookstore",
              ("echo " + $compose + " | base64 -d | sudo tee /opt/cloudops-ai-bookstore/docker-compose.aws.yml >/dev/null"),
              ("echo " + $nginx + " | base64 -d | sudo tee /opt/cloudops-ai-bookstore/nginx.conf >/dev/null"),
              ("echo " + $deploy + " | base64 -d | sudo tee /opt/cloudops-ai-bookstore/deploy.sh >/dev/null"),
              "sudo chmod 0755 /opt/cloudops-ai-bookstore/deploy.sh",
              ("printf %s\\n AWS_REGION=" + $region + " ECR_REGISTRY=" + $registry + " ECR_REPOSITORY=" + $repository + " IMAGE_TAG=" + $tag + " | sudo tee /opt/cloudops-ai-bookstore/deploy.env >/dev/null"),
              "set -a; . /opt/cloudops-ai-bookstore/deploy.env; set +a; sudo -E /opt/cloudops-ai-bookstore/deploy.sh"
            ]}' > ssm-commands.json

      - name: Deploy through AWS Systems Manager
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file://ssm-commands.json \
            --query Command.CommandId \
            --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

