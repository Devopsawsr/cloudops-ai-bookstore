name: Deploy course marks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - course-marks/**
      - .github/workflows/deploy-course-marks.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: course-marks-practice
  cancel-in-progress: false

jobs:
  check:
    name: Check the function code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse both functions
        run: python -m py_compile course-marks/validate.py course-marks/process.py

  deploy:
    name: Deploy to the practice functions
    needs: check
    runs-on: ubuntu-latest
    environment: aws-dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials using GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish the validate function
        run: |
          set -euo pipefail
          cp course-marks/validate.py lambda_function.py
          zip -q -j validate.zip lambda_function.py
          aws lambda update-function-code \
            --function-name course-marks-validate-practice \
            --zip-file fileb://validate.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name course-marks-validate-practice \
            --region "$AWS_REGION"

      - name: Publish the process function
        run: |
          set -euo pipefail
          cp course-marks/process.py lambda_function.py
          zip -q -j process.zip lambda_function.py
          aws lambda update-function-code \
            --function-name course-marks-process-practice \
            --zip-file fileb://process.zip \
            --region "$AWS_REGION"
          aws lambda wait function-updated \
            --function-name course-marks-process-practice \
            --region "$AWS_REGION"

      - name: Show the code now running
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name course-marks-validate-practice \
            --region "$AWS_REGION" \
            --query "{function:FunctionName,sha:CodeSha256,modified:LastModified}"
          aws lambda get-function-configuration \
            --function-name course-marks-process-practice \
            --region "$AWS_REGION" \
            --query "{function:FunctionName,sha:CodeSha256,modified:LastModified}"
